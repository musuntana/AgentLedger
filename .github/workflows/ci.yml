# SPDX-License-Identifier: Apache-2.0
# AgentLedger local gates. Browser/Anvil runs are local-scope only:
# simulation, loopback Anvil and read-only public Testnet reads.
# No wallet, no signing, no public-chain mutation, never payment acceptance.
name: agentledger-gates

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-sdk-python-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workspace deps
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Python test and browser dependencies
        run: python3 -m pip install --upgrade pytest playwright==1.56.0
      - name: Node + SDK + Python suite
        run: npm test
      - name: SDK consumer types and npm pack safety
        run: |
          npm --prefix sdk run typecheck
          npm --prefix sdk run packcheck
      - name: Offline readiness check
        run: node tools/onsite-check.mjs
      - name: Portable judge handoff check (offline, no publication)
        run: npm run submit:check
      - name: Studio Chromium simulation (seven steps, local only)
        run: npm run test:browser
      - name: Real public Testnet read-only smoke (needs dev server)
        run: |
          node tools/dev.mjs &
          dev_pid=$!
          sleep 3
          curl -fsS http://127.0.0.1:4321/api/healthz > /dev/null
          curl -fsS http://127.0.0.1:4322/ > /dev/null
          timeout 180 python3 examples/verifier/browser/demo-public-read-smoke.py
          kill "$dev_pid" 2>/dev/null || true

  pocket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/pocket/package-lock.json
      - name: Install workspace deps (verifier + viem for the live gate)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Pocket deps
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/pocket
      - name: TypeScript + unit tests (portable SHA-256)
        run: |
          npm run typecheck
          npm test
        working-directory: apps/pocket
      - name: Expo Web static export
        run: npm run export:web
        working-directory: apps/pocket
      - name: Pocket Chromium smoke (exported app, local only)
        run: npm run test:browser
        working-directory: apps/pocket
      - name: Live read-only Testnet acceptance (real task via loopback verifier)
        run: npm run test:browser:live
        working-directory: apps/pocket

  judge-pitch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slides/package-lock.json
      - name: Install pinned Slidev tooling
        working-directory: slides
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the 7-slide judge pitch
        working-directory: slides
        run: |
          npm run build:judge
          npm run build:judge:en
          test -f dist-judge/index.html
          test -f dist-judge-en/index.html
          test -s judge.md
          test -s judge.en.md


  cloudflare-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            slides/package-lock.json
            apps/pocket/package-lock.json
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Wrangler deploy builds missing assets and bundles Worker (no upload)
        run: npx wrangler deploy --dry-run --outdir out/cloudflare/dry-run
      - name: Check Studio, Pocket and bilingual Pitch assets
        run: |
          node -e "const fs=require('node:fs'); const p='out/cloudflare/public/'; for(const f of ['studio.html','workbench.html','verdict-matrix.mjs','pocket/index.html','pitch/index.html','pitch/en/index.html']) {if(!fs.existsSync(p+f)) throw Error('missing asset: '+f)}"
      - name: Repeat dry-run with complete assets (no duplicate build)
        run: npx wrangler deploy --dry-run --outdir out/cloudflare/dry-run-second

  forge-anvil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Node deps (viem for acceptance script)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Forge build + contract tests
        run: |
          forge --version
          forge build --sizes
          forge test -vvv
      - name: Hermetic Anvil acceptance (simulated recorder payment, loopback)
        run: |
          anvil --port 18545 --chain-id 10143 &
          sleep 2
          node examples/verifier/tools/anvil-acceptance.mjs
